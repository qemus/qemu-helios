name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VERSION: 1.${{ vars.MAJOR }}.${{ vars.MINOR }}
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build package
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false
          outputs: type=local,dest=output
          platforms: linux/amd64
          build-args: |
            VERSION_ARG=${{ env.VERSION }}
      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ env.VERSION }}"
          title: "v${{ env.VERSION }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Add package to release
        uses: AButler/upload-release-assets@v4.0
        with:
          files: 'output/*.deb'
          release-tag: "v${{ env.VERSION }}"
          repo-token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Increment version variable
        uses: action-pack/increment@v2
        with:
          name: 'MINOR'
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Build of ${{ github.event.repository.name }} v${{ env.VERSION }} completed
          body: |
              The build job of ${{ github.event.repository.name }} v${{ env.VERSION }} was completed successfully! 

              See https://github.com/${{ github.repository }}/actions for more information.
